<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="tanstack-fetch: typed fetch for TanStack Query">
<defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#ea580c"/><stop offset=".5" stop-color="#f97316"/><stop offset="1" stop-color="#fbbf24"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="7s" repeatCount="indefinite"/>
</linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="50"/></filter><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".07"/></pattern></defs>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade 1s ease forwards}
@keyframes fade{to{opacity:1}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace} .sans{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
</style>
<rect x=".5" y=".5" width="999" height="439" rx="22" fill="#0b0806" stroke="#2a1c12"/>
<rect x="1" y="1" width="998" height="438" rx="22" fill="url(#dots)"/>
<circle cx="720" cy="220" r="160" fill="#ea580c" opacity=".22" filter="url(#blur)"/>
<g class="up"><text x="48" y="66" class="mono" font-size="12.5" font-weight="700" letter-spacing="3" fill="#f97316">FEATURED · OPEN SOURCE</text>
<text x="46" y="118" class="sans" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#f5ede6">tanstack-fetch</text>
<text x="48" y="152" class="sans" font-size="20" font-weight="700" fill="url(#og)">Typed fetch, made simple.</text></g>
<g class="up" style="animation-delay:.25s"><text x="48" y="188" class="sans" font-size="15" fill="#a8968a">The fetch client that speaks queryFn — data on success,</text>
<text x="48" y="210" class="sans" font-size="15" fill="#a8968a">typed FetchError on failure, AbortSignal honored.</text></g>
<g class="up" style="animation-delay:0.45s"><rect x="48" y="240" width="290" height="34" rx="10" fill="#140e0a" stroke="#2a1c12"><animate attributeName="stroke" values="#2a1c12;#f97316;#2a1c12;#2a1c12" keyTimes="0;0.050;0.333;1" dur="6s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect>
<circle cx="68" cy="257" r="8" fill="url(#og)"/><path d="M64 257l3 3 5-6" fill="none" stroke="#1a0d04" stroke-width="2" stroke-linecap="round"/>
<text x="86" y="262" class="mono" font-size="13.5" fill="#f5ede6">data on success</text></g>
<g class="up" style="animation-delay:0.60s"><rect x="48" y="282" width="290" height="34" rx="10" fill="#140e0a" stroke="#2a1c12"><animate attributeName="stroke" values="#2a1c12;#f97316;#2a1c12;#2a1c12" keyTimes="0;0.383;0.667;1" dur="6s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect>
<circle cx="68" cy="299" r="8" fill="url(#og)"/><path d="M64 299l3 3 5-6" fill="none" stroke="#1a0d04" stroke-width="2" stroke-linecap="round"/>
<text x="86" y="304" class="mono" font-size="13.5" fill="#f5ede6">FetchError on failure</text></g>
<g class="up" style="animation-delay:0.75s"><rect x="48" y="324" width="290" height="34" rx="10" fill="#140e0a" stroke="#2a1c12"><animate attributeName="stroke" values="#2a1c12;#f97316;#2a1c12;#2a1c12" keyTimes="0;0.717;1.000;1" dur="6s" begin="0s" repeatCount="indefinite" calcMode="discrete"/></rect>
<circle cx="68" cy="341" r="8" fill="url(#og)"/><path d="M64 341l3 3 5-6" fill="none" stroke="#1a0d04" stroke-width="2" stroke-linecap="round"/>
<text x="86" y="346" class="mono" font-size="13.5" fill="#f5ede6">AbortSignal honored</text></g>
<g class="up" style="animation-delay:1s"><text x="48" y="396" class="sans" font-size="22" font-weight="800" fill="#f97316">3.68KB</text><text x="48" y="414" class="mono" font-size="10.5" letter-spacing="1.5" fill="#6b5a4e">GZIP CORE</text></g>
<g class="up" style="animation-delay:1s"><text x="158" y="396" class="sans" font-size="22" font-weight="800" fill="#f97316">0</text><text x="158" y="414" class="mono" font-size="10.5" letter-spacing="1.5" fill="#6b5a4e">RUNTIME DEPS</text></g>
<g class="up" style="animation-delay:1s"><text x="268" y="396" class="sans" font-size="22" font-weight="800" fill="#f97316">8</text><text x="268" y="414" class="mono" font-size="10.5" letter-spacing="1.5" fill="#6b5a4e">FRAMEWORKS</text></g>
<g class="fade" style="animation-delay:.3s"><g transform="translate(470 70) skewY(-5) skewX(4)"><g class="float">
<rect x="0" y="0" width="480" height="270" rx="16" fill="#140e0a" stroke="#f97316" stroke-opacity=".45"/><rect x="0" y="0" width="480" height="270" rx="16" fill="none" stroke="url(#og)" stroke-opacity=".9" stroke-dasharray="120 900"><animate attributeName="stroke-dashoffset" values="0;-1020" dur="6s" repeatCount="indefinite"/></rect><circle cx="22" cy="22" r="5" fill="#f97316"/><circle cx="38" cy="22" r="5" fill="#3a2a1e"/><circle cx="54" cy="22" r="5" fill="#3a2a1e"/><text x="76" y="27" class="mono" font-size="12.5" fill="#a8968a">app.ts</text><line x1="0" y1="44" x2="480" y2="44" stroke="#2a1c12"/>
<text x="22" y="74" class="mono up" style="animation-delay:0.60s" font-size="13" xml:space="preserve"><tspan fill="#6b5a4e"> 1  </tspan><tspan fill="#f472b6">import</tspan><tspan fill="#f5ede6"> { createFetch } </tspan><tspan fill="#f472b6">from</tspan><tspan fill="#86efac"> 'tanstack-fetch'</tspan></text>
<text x="22" y="95" class="mono up" style="animation-delay:0.72s" font-size="13" xml:space="preserve"><tspan fill="#6b5a4e"> 2  </tspan></text>
<text x="22" y="116" class="mono up" style="animation-delay:0.84s" font-size="13" xml:space="preserve"><tspan fill="#6b5a4e"> 3  </tspan><tspan fill="#f472b6">const</tspan><tspan fill="#f5ede6"> api = </tspan><tspan fill="#fbbf24">createFetch</tspan><tspan fill="#f5ede6">({ baseUrl: </tspan><tspan fill="#86efac">'/api'</tspan><tspan fill="#f5ede6"> })</tspan></text>
<text x="22" y="137" class="mono up" style="animation-delay:0.96s" font-size="13" xml:space="preserve"><tspan fill="#6b5a4e"> 4  </tspan></text>
<text x="22" y="158" class="mono up" style="animation-delay:1.08s" font-size="13" xml:space="preserve"><tspan fill="#6b5a4e"> 5  </tspan><tspan fill="#fbbf24">useQuery</tspan><tspan fill="#f5ede6">({</tspan></text>
<text x="22" y="179" class="mono up" style="animation-delay:1.20s" font-size="13" xml:space="preserve"><tspan fill="#6b5a4e"> 6  </tspan><tspan fill="#f5ede6">  queryKey: [</tspan><tspan fill="#86efac">'users'</tspan><tspan fill="#f5ede6">],</tspan></text>
<text x="22" y="200" class="mono up" style="animation-delay:1.32s" font-size="13" xml:space="preserve"><tspan fill="#6b5a4e"> 7  </tspan><tspan fill="#f5ede6">  queryFn: ({ signal }) =&gt;</tspan></text>
<text x="22" y="221" class="mono up" style="animation-delay:1.44s" font-size="13" xml:space="preserve"><tspan fill="#6b5a4e"> 8  </tspan><tspan fill="#f5ede6">    api.</tspan><tspan fill="#fbbf24">get</tspan><tspan fill="#f5ede6">&lt;User[]&gt;(</tspan><tspan fill="#86efac">'/users'</tspan><tspan fill="#f5ede6">, { signal }),</tspan></text>
<text x="22" y="242" class="mono up" style="animation-delay:1.56s" font-size="13" xml:space="preserve"><tspan fill="#6b5a4e"> 9  </tspan><tspan fill="#f5ede6">})</tspan></text>
</g></g></g>
<g class="up" style="animation-delay:1.8s"><g style="animation:float 5s ease-in-out 1s infinite"><g transform="translate(700 288) skewY(-5) skewX(4)">
<rect width="250" height="112" rx="14" fill="#1a120c" stroke="#f97316" stroke-opacity=".6"/>
<text x="16" y="26" class="mono" font-size="11" letter-spacing="2" fill="#f97316">RESULT</text>
<text x="16" y="52" class="mono" font-size="12.5" fill="#6b5a4e">// data is User[]</text>
<text x="16" y="72" class="mono" font-size="12.5" fill="#f5ede6">[{ id: '1', name: <tspan fill="#86efac">'Ada'</tspan> }]</text>
<text x="16" y="96" class="mono" font-size="12.5" fill="#a8968a">isError → <tspan fill="#fbbf24">false</tspan></text>
</g></g></g>
</svg>