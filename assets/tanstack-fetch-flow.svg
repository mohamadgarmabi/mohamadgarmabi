<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="tanstack-fetch request flow">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#16a34a"/><stop offset=".5" stop-color="#4ade80"/><stop offset="1" stop-color="#a3e635"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.nt{font:700 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#e2f5ea} .ns{font:400 12px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#8fb3a0}
.core{font:800 22px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:url(#g)} .pk{font:600 11px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace} .pill{font:600 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#e2f5ea}
.wire{fill:none;stroke:#2c5a3d;stroke-width:2;stroke-dasharray:6 6;animation:dash 1s linear infinite}
.h{font:700 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#8fb3a0;letter-spacing:2px}
@keyframes dash{to{stroke-dashoffset:-12}}
</style>
<rect x=".5" y=".5" width="859" height="329" rx="16" fill="#0c1a12" stroke="#1a3324"/>
<text x="30" y="46" class="h">REQUEST → RESPONSE, FULLY TYPED</text>
<rect x="30" y="58" height="2" width="0" fill="url(#g)"><animate attributeName="width" from="0" to="250" dur="1.2s" fill="freeze"/></rect>
<rect width="0" height="0"><animate id="cy" attributeName="x" from="0" to="0" dur="8s" begin="0s;cy.end"/></rect><path id="p1" d="M200 145 C 250 145, 270 140, 320 140" class="wire"/>
<path id="p2" d="M540 140 C 590 140, 610 145, 660 145" class="wire"/>
<path id="p3" d="M660 172 C 610 172, 590 178, 540 178" class="wire"/>
<path id="p4" d="M320 178 C 270 178, 250 172, 200 172" class="wire"/><g class=""><rect x="30" y="120" width="170" height="76" rx="12" fill="#10241a" stroke="#4ade80" stroke-opacity=".8"/>
<text x="115.0" y="154.0" text-anchor="middle" class="nt">Your App</text>
<text x="115.0" y="174.0" text-anchor="middle" class="ns">React · TanStack Query</text></g><rect x="320" y="104" width="220" height="108" rx="14" fill="#0f2a1b" stroke="url(#g)" stroke-width="2"/>
<rect x="320" y="104" width="220" height="108" rx="14" fill="none" stroke="#16a34a" stroke-width="6" opacity=".25">
<animate attributeName="opacity" values=".05;.35;.05" dur="2.4s" repeatCount="indefinite"/></rect>
<text x="430" y="150" text-anchor="middle" class="core">tanstack-fetch</text>
<text x="430" y="174" text-anchor="middle" class="ns">type-safe fetch client</text>
<g transform="translate(430 194)"><circle r="4" fill="#2dd4bf"><animate attributeName="r" values="3;5;3" dur="1.2s" repeatCount="indefinite"/></circle></g><g class=""><rect x="660" y="120" width="170" height="76" rx="12" fill="#10241a" stroke="#a3e635" stroke-opacity=".8"/>
<text x="745.0" y="154.0" text-anchor="middle" class="nt">HTTP API</text>
<text x="745.0" y="174.0" text-anchor="middle" class="ns">REST · JSON</text></g><g opacity="0"><circle r="6" fill="#4ade80" filter="url(#glow)"/><text y="-10" text-anchor="middle" class="pk" fill="#4ade80">GET /users</text>
<animateMotion dur="1.0s" begin="cy.begin+0.2s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p1"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+0.2s"/><set attributeName="opacity" to="0" begin="cy.begin+1.20s"/></g><g opacity="0"><circle r="6" fill="#4ade80" filter="url(#glow)"/>
<animateMotion dur="1.0s" begin="cy.begin+1.4s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p2"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+1.4s"/><set attributeName="opacity" to="0" begin="cy.begin+2.40s"/></g><g opacity="0"><circle r="6" fill="#2dd4bf" filter="url(#glow)"/><text y="-10" text-anchor="middle" class="pk" fill="#2dd4bf">200</text>
<animateMotion dur="1.0s" begin="cy.begin+2.6s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p3"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+2.6s"/><set attributeName="opacity" to="0" begin="cy.begin+3.60s"/></g><g opacity="0"><circle r="6" fill="#2dd4bf" filter="url(#glow)"/><text y="-10" text-anchor="middle" class="pk" fill="#2dd4bf">data: User[]</text>
<animateMotion dur="1.0s" begin="cy.begin+3.6s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p4"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+3.6s"/><set attributeName="opacity" to="0" begin="cy.begin+4.60s"/></g><g opacity="0"><circle r="6" fill="#4ade80" filter="url(#glow)"/><text y="-10" text-anchor="middle" class="pk" fill="#4ade80">POST /orders</text>
<animateMotion dur="1.0s" begin="cy.begin+4.2s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p1"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+4.2s"/><set attributeName="opacity" to="0" begin="cy.begin+5.20s"/></g><g opacity="0"><circle r="6" fill="#4ade80" filter="url(#glow)"/>
<animateMotion dur="1.0s" begin="cy.begin+5.4s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p2"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+5.4s"/><set attributeName="opacity" to="0" begin="cy.begin+6.40s"/></g><g opacity="0"><circle r="6" fill="#f87171" filter="url(#glow)"/><text y="-10" text-anchor="middle" class="pk" fill="#f87171">422</text>
<animateMotion dur="1.0s" begin="cy.begin+6.4s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p3"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+6.4s"/><set attributeName="opacity" to="0" begin="cy.begin+7.40s"/></g><g opacity="0"><circle r="6" fill="#fbbf24" filter="url(#glow)"/><text y="-10" text-anchor="middle" class="pk" fill="#fbbf24">typed error</text>
<animateMotion dur="1.0s" begin="cy.begin+7.0s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p4"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+7.0s"/><set attributeName="opacity" to="0" begin="cy.begin+8.00s"/></g><g><rect x="95" y="252" width="210" height="38" rx="19" fill="#10241a" stroke="#4ade80" stroke-opacity=".35">
<animate attributeName="stroke-opacity" values=".35;1;1;.35" keyTimes="0;.1;.8;1" dur="2s" begin="cy.begin+0.2s"/>
<animate attributeName="fill" values="#10241a;#4ade8022;#4ade8022;#10241a" keyTimes="0;.1;.8;1" dur="2s" begin="cy.begin+0.2s"/></rect>
<circle cx="117" cy="271" r="5" fill="#4ade80"/>
<text x="210" y="276" text-anchor="middle" class="pill">Type-safe requests</text></g><g><rect x="335" y="252" width="210" height="38" rx="19" fill="#10241a" stroke="#fbbf24" stroke-opacity=".35">
<animate attributeName="stroke-opacity" values=".35;1;1;.35" keyTimes="0;.1;.8;1" dur="2s" begin="cy.begin+6.4s"/>
<animate attributeName="fill" values="#10241a;#fbbf2422;#fbbf2422;#10241a" keyTimes="0;.1;.8;1" dur="2s" begin="cy.begin+6.4s"/></rect>
<circle cx="357" cy="271" r="5" fill="#fbbf24"/>
<text x="450" y="276" text-anchor="middle" class="pill">Predictable errors</text></g><g><rect x="575" y="252" width="210" height="38" rx="19" fill="#10241a" stroke="#16a34a" stroke-opacity=".35">
<animate attributeName="stroke-opacity" values=".35;1;1;.35" keyTimes="0;.1;.8;1" dur="2s" begin="cy.begin+1.4s"/>
<animate attributeName="fill" values="#10241a;#16a34a22;#16a34a22;#10241a" keyTimes="0;.1;.8;1" dur="2s" begin="cy.begin+1.4s"/></rect>
<circle cx="597" cy="271" r="5" fill="#16a34a"/>
<text x="690" y="276" text-anchor="middle" class="pill">Extensible workflows</text></g>
</svg>