<circle cx="357" cy="271" r="5" fill="#fbbf24"/>
<text x="450" y="276" text-anchor="middle" class="pill">Predictable errors</text></g><g><rect x="575" y="252" width="210" height="38" rx="19" fill="#111c33" stroke="#a78bfa" stroke-opacity=".35">
<animate attributeName="stroke-opacity" values=".35;1;1;.35" keyTimes="0;.1;.8;1" dur="2s" begin="cy.begin+1.4s"/>
<animate attributeName="fill" values="#111c33;#a78bfa22;#a78bfa22;#111c33" keyTimes="0;.1;.8;1" dur="2s" begin="cy.begin+1.4s"/></rect>
<circle cx="597" cy="271" r="5" fill="#a78bfa"/>
<text x="690" y="276" text-anchor="middle" class="pill">Extensible workflows</text></g>
</svg>