<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="tanstack-fetch request flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.nt{font:700 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#e2e8f0} .ns{font:400 12px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#94a3b8}
.core{font:800 22px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:url(#g)} .pk{font:600 11px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace} .pill{font:600 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#e2e8f0}
.wire{fill:none;stroke:#334155;stroke-width:2;stroke-dasharray:6 6;animation:dash 1s linear infinite}
.h{font:700 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#94a3b8;letter-spacing:2px}
@keyframes dash{to{stroke-dashoffset:-12}}
</style>
<rect x=".5" y=".5" width="859" height="329" rx="16" fill="#0f172a" stroke="#1e293b"/>
<text x="30" y="46" class="h">REQUEST → RESPONSE, FULLY TYPED</text>
<rect x="30" y="58" height="2" width="0" fill="url(#g)"><animate attributeName="width" from="0" to="250" dur="1.2s" fill="freeze"/></rect>
<rect width="0" height="0"><animate id="cy" attributeName="x" from="0" to="0" dur="8s" begin="0s;cy.end"/></rect><path id="p1" d="M200 145 C 250 145, 270 140, 320 140" class="wire"/>
<path id="p2" d="M540 140 C 590 140, 610 145, 660 145" class="wire"/>
<path id="p3" d="M660 172 C 610 172, 590 178, 540 178" class="wire"/>
