<rect x="320" y="104" width="220" height="108" rx="14" fill="none" stroke="#a78bfa" stroke-width="6" opacity=".25">
<animate attributeName="opacity" values=".05;.35;.05" dur="2.4s" repeatCount="indefinite"/></rect>
<text x="430" y="150" text-anchor="middle" class="core">tanstack-fetch</text>
<text x="430" y="174" text-anchor="middle" class="ns">type-safe fetch client</text>
<g transform="translate(430 194)"><circle r="4" fill="#34d399"><animate attributeName="r" values="3;5;3" dur="1.2s" repeatCount="indefinite"/></circle></g><g class=""><rect x="660" y="120" width="170" height="76" rx="12" fill="#111c33" stroke="#f472b6" stroke-opacity=".8"/>
<text x="745.0" y="154.0" text-anchor="middle" class="nt">HTTP API</text>
<text x="745.0" y="174.0" text-anchor="middle" class="ns">REST · JSON</text></g><g opacity="0"><circle r="6" fill="#22d3ee" filter="url(#glow)"/><text y="-10" text-anchor="middle" class="pk" fill="#22d3ee">GET /users</text>
<animateMotion dur="1.0s" begin="cy.begin+0.2s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p1"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+0.2s"/><set attributeName="opacity" to="0" begin="cy.begin+1.20s"/></g><g opacity="0"><circle r="6" fill="#22d3ee" filter="url(#glow)"/>
<animateMotion dur="1.0s" begin="cy.begin+1.4s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p2"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+1.4s"/><set attributeName="opacity" to="0" begin="cy.begin+2.40s"/></g><g opacity="0"><circle r="6" fill="#34d399" filter="url(#glow)"/><text y="-10" text-anchor="middle" class="pk" fill="#34d399">200</text>
<animateMotion dur="1.0s" begin="cy.begin+2.6s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p3"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+2.6s"/><set attributeName="opacity" to="0" begin="cy.begin+3.60s"/></g><g opacity="0"><circle r="6" fill="#34d399" filter="url(#glow)"/><text y="-10" text-anchor="middle" class="pk" fill="#34d399">data: User[]</text>
<animateMotion dur="1.0s" begin="cy.begin+3.6s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p4"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+3.6s"/><set attributeName="opacity" to="0" begin="cy.begin+4.60s"/></g><g opacity="0"><circle r="6" fill="#22d3ee" filter="url(#glow)"/><text y="-10" text-anchor="middle" class="pk" fill="#22d3ee">POST /orders</text>
<animateMotion dur="1.0s" begin="cy.begin+4.2s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p1"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+4.2s"/><set attributeName="opacity" to="0" begin="cy.begin+5.20s"/></g><g opacity="0"><circle r="6" fill="#22d3ee" filter="url(#glow)"/>
<animateMotion dur="1.0s" begin="cy.begin+5.4s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p2"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+5.4s"/><set attributeName="opacity" to="0" begin="cy.begin+6.40s"/></g><g opacity="0"><circle r="6" fill="#f87171" filter="url(#glow)"/><text y="-10" text-anchor="middle" class="pk" fill="#f87171">422</text>
<animateMotion dur="1.0s" begin="cy.begin+6.4s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p3"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+6.4s"/><set attributeName="opacity" to="0" begin="cy.begin+7.40s"/></g><g opacity="0"><circle r="6" fill="#fbbf24" filter="url(#glow)"/><text y="-10" text-anchor="middle" class="pk" fill="#fbbf24">typed error</text>
<animateMotion dur="1.0s" begin="cy.begin+7.0s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"><mpath href="#p4"/></animateMotion>
<set attributeName="opacity" to="1" begin="cy.begin+7.0s"/><set attributeName="opacity" to="0" begin="cy.begin+8.00s"/></g><g><rect x="95" y="252" width="210" height="38" rx="19" fill="#111c33" stroke="#22d3ee" stroke-opacity=".35">
<animate attributeName="stroke-opacity" values=".35;1;1;.35" keyTimes="0;.1;.8;1" dur="2s" begin="cy.begin+0.2s"/>
<animate attributeName="fill" values="#111c33;#22d3ee22;#22d3ee22;#111c33" keyTimes="0;.1;.8;1" dur="2s" begin="cy.begin+0.2s"/></rect>
<circle cx="117" cy="271" r="5" fill="#22d3ee"/>
<text x="210" y="276" text-anchor="middle" class="pill">Type-safe requests</text></g><g><rect x="335" y="252" width="210" height="38" rx="19" fill="#111c33" stroke="#fbbf24" stroke-opacity=".35">
<animate attributeName="stroke-opacity" values=".35;1;1;.35" keyTimes="0;.1;.8;1" dur="2s" begin="cy.begin+6.4s"/>
