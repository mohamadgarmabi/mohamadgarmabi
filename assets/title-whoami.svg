<svg xmlns="http://www.w3.org/2000/svg" width="860" height="64" viewBox="0 0 860 64" role="img" aria-label="whoami" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
</linearGradient></defs>
<style>.t{font:800 26px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:url(#g)} .i{font:700 24px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#22d3ee}
.w{opacity:0;animation:in .7s .1s ease forwards} @keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}</style>
<g class="w"><text x="4" y="36" class="i">❯</text><text x="44" y="36" class="t">whoami</text>
<rect x="147" y="16" width="12" height="24" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect></g>
<rect x="4" y="52" height="3" rx="1.5" width="0" fill="url(#g)"><animate attributeName="width" from="0" to="852" dur="1.4s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect>
<circle cy="53.5" r="4" fill="#fff"><animate attributeName="cx" from="4" to="856" dur="1.4s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></circle>
</svg>