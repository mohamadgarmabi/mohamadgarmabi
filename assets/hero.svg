<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Mohammad Garmabi — Senior Software Engineer">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#16a34a"/><stop offset=".5" stop-color="#4ade80"/><stop offset="1" stop-color="#a3e635"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="900" height="300" rx="18"/></clipPath>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
</defs>
<style>
.name{font:800 58px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:-1px;fill:url(#g);stroke:url(#g);stroke-width:1.5;
  stroke-dasharray:900;stroke-dashoffset:900;fill-opacity:0;animation:draw 2.4s ease forwards, fill .8s 1.8s ease forwards}
.hi{font:600 16px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#8fb3a0;opacity:0;animation:up .8s .2s ease forwards}
.role{font:500 21px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#e2f5ea}
.foot{font:500 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#8fb3a0;opacity:0;animation:up .8s 2.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fill{to{fill-opacity:1;stroke-width:0}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
