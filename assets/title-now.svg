<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="70" viewBox="0 0 1000 70" role="img" aria-label="currently exploring">
<defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#ea580c"/><stop offset=".5" stop-color="#f97316"/><stop offset="1" stop-color="#fbbf24"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="7s" repeatCount="indefinite"/>
</linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="50"/></filter><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".07"/></pattern></defs>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade 1s ease forwards}
@keyframes fade{to{opacity:1}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace} .sans{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
</style>
<g class="up"><text x="4" y="40" class="mono" font-size="13" fill="#6b5a4e">05 /</text>
<text x="46" y="40" class="mono" font-size="15" font-weight="700" letter-spacing="3" fill="#f97316">CURRENTLY EXPLORING</text></g>
<line x1="280.4" y1="35" x2="280.4" y2="35" stroke="#2a1c12" stroke-width="1.5"><animate attributeName="x2" from="280.4" to="996" dur="1.4s" begin=".2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></line>
<circle cx="280.4" cy="35" r="3.5" fill="#fbbf24" opacity="0" filter="url(#glow)"><animate attributeName="cx" values="280.4;996" dur="3.2s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
</svg>